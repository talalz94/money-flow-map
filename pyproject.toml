[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyflow"
version = "1.0.0"
description = "Real-time cross-market money-flow read (heuristic) with a local API and an optional dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
fast = ["orjson>=3.9"]
measure = ["psutil>=5.9"]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
moneyflow = "moneyflow.cli:main"

[tool.setuptools]
packages = ["moneyflow", "moneyflow.connectors"]

[tool.setuptools.package-data]
moneyflow = ["default.toml", "static/*", "schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
