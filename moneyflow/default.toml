# moneyflow default configuration. Do not edit this file: put changes in `moneyflow.toml` (or the
# git-ignored `moneyflow.local.toml`) next to README.md. Those files are merged over this one;
# [[series]] entries merge by `id` (set `enabled = false` to drop one, or add a new id).

[general]
default_timeframe = "today"       # 1h | today | 1w
local_timezone = ""               # second clock (Fed countdown, event times): an IANA zone such as
                                  # "Asia/Karachi", or "" for this PC's own time zone
data_dir = "data"                 # caches (history, FOMC calendar); git-ignored
history_days = 35                 # 5-minute history kept per instrument
log_level = "INFO"

[server]
host = "127.0.0.1"                # localhost only; set "0.0.0.0" AND a token to share on your LAN
port = 8765
dashboard = true                  # false (or --no-dashboard) = API only, no web page
open_browser = false              # open the dashboard when the service starts
push_interval_s = 1.0             # WebSocket / SSE update cadence
token = ""                        # optional shared secret for /api, /ws, /sse (header X-Moneyflow-Token or ?token=)
cors_origin = "*"                 # GET-only CORS for other local apps ("" disables)
allowed_hosts = []                # extra Host headers accepted besides localhost (DNS-rebinding guard)

[keys]
# .env files to read API keys from (relative to the project folder). Values are read at runtime
# and never printed, logged, cached or served. The process environment wins over files.
env_files = [".env"]

[flow]
theta = 0.5          # |z| a node needs to count as an inflow or outflow
max_edges = 16
per_node = 5
min_weight = 0.3
stale_after_s = 120  # a streaming source silent this long (market open) is shown as STALE.
                     # Alpaca IEX gets 600 s (thin ETFs trade on IEX only every few minutes);
                     # any [[series]] can set its own stale_after_s

[risk]
scale = 1.5          # score = 100·tanh(S / scale)
clip = 4.0
components = [
  { id = "equities_vs_bonds", kind = "spread", inputs = ["spx", "bonds"], weight = 0.25, label = "S&P 500 vs Treasuries (TLT)" },
  { id = "fear",              kind = "neg",    inputs = ["vix_proxy"],    weight = 0.20, label = "Volatility (UVXY perp, inverted)" },
  { id = "crypto",            kind = "mean",   inputs = ["btc", "eth"],   weight = 0.15, label = "Bitcoin and Ether" },
  { id = "credit",            kind = "spread", inputs = ["hyg", "ief"],   weight = 0.10, label = "High-yield credit vs Treasuries (HYG vs IEF)" },
  { id = "dollar",            kind = "neg",    inputs = ["usd"],          weight = 0.10, label = "US dollar (inverted)" },
  { id = "stablecoin_share",  kind = "neg",    inputs = ["stables"],      weight = 0.10, label = "Stablecoin share of crypto (inverted)" },
  { id = "gold",              kind = "neg",    inputs = ["gold"],         weight = 0.05, label = "Gold, haven demand (inverted)" },
  { id = "tech_leadership",   kind = "spread", inputs = ["ndx", "spx"],   weight = 0.05, label = "Nasdaq 100 vs S&P 500" },
]

[webhooks]
# Push events to other apps:  targets = [{ url = "http://127.0.0.1:9000/hook", events = ["regime_change"] }]
# events: regime_change, strongest_flow_change, extreme_move (|z| >= extreme_z), snapshot (every min_interval_s)
targets = []
min_interval_s = 60
extreme_z = 3.0

# ── connectors ──────────────────────────────────────────────────────────────────────────────
[connectors.binance_spot]          # public websocket, no key: BTC, ETH, the stablecoin-share basket
enabled = true
trade_stream = true                # every BTC/ETH trade (~100 ms fresh; 15-50 messages/s per coin, the
                                   # busiest feed). false = 1-minute klines only (prices up to ~2 s old,
                                   # about half the service's CPU)
ws_url = "wss://stream.binance.com:9443/stream"
rest_url = "https://api.binance.com"

[connectors.binance_fut]           # USD-M futures public websocket, no key: TradFi + crypto perps
enabled = true
ws_url = "wss://fstream.binance.com/market/stream"   # the legacy /stream path no longer delivers data
rest_url = "https://fapi.binance.com"
oi_symbols = ["BTCUSDT", "ETHUSDT"]                  # open interest polled every `oi_interval_s`
funding_symbols = ["BTCUSDT", "ETHUSDT"]
oi_interval_s = 60

[connectors.alpaca]                # free Basic plan: real-time IEX websocket + news (ALPACA_KEY_ID/SECRET)
enabled = true
ws_url = "wss://stream.data.alpaca.markets/v2/iex"
news_ws_url = "wss://stream.data.alpaca.markets/v1beta1/news"
rest_url = "https://data.alpaca.markets"
feed = "iex"
news = true
quote_symbols = ["TLT"]   # also stream bid/ask (continuous mid price) for these. Measured at the US
                          # open: TLT 52, IEF 27, HYG 17 quote messages/s, so only the bonds node gets them

[connectors.finnhub]               # FINNHUB_KEY: real-time OANDA FX (for the DXY) and general news
enabled = true
ws_url = "wss://ws.finnhub.io"
rest_url = "https://finnhub.io/api/v1"
news = true
news_interval_s = 150

[connectors.coinbase]              # public: BTC/ETH reference prices -> the Coinbase premium
enabled = true
ws_url = "wss://ws-feed.exchange.coinbase.com"

[connectors.hyperliquid]           # public: optional 24/7 fallback (HIP-3 index/commodity perps)
enabled = false                    # tested live 24 Nov 2026 (xyz:XYZ100 node); its history API gives at
                                   # most 5,000 candles (~17 days of 5-minute data, enough for every σ)
ws_url = "wss://api.hyperliquid.xyz/ws"
rest_url = "https://api.hyperliquid.xyz/info"

[connectors.cboe]                  # Cboe delayed quotes: the VIX level (15 minutes delayed)
enabled = true
interval_s = 60

[connectors.coingecko]             # public: total crypto market cap (anchors the stablecoin share)
enabled = true
interval_s = 300

[connectors.defillama]             # public: stablecoin supply (mints / burns = real new cash)
enabled = true
interval_s = 1800

[connectors.fred]                  # FRED_API_KEY: daily yields and credit spread (context, 1 day lag)
enabled = true
series = ["DGS10", "DGS2", "BAMLH0A0HYM2"]
interval_s = 21600

[connectors.fed]                   # federalreserve.gov FOMC calendar (no key), refreshed daily
enabled = true

[connectors.ffcal]                 # Forex Factory's weekly calendar export: scheduled US data
enabled = true
interval_s = 7200

[connectors.farside]               # Farside Investors: daily US spot BTC / ETH ETF flows
# OFF by default: on 2026-11-24 Farside's Cloudflare answered this program's HTTP client with a
# bot challenge (HTTP 403, cf-mitigated: challenge). Bot checks are respected, not worked around.
enabled = false
interval_s = 7200

[connectors.yahoo]                 # unofficial chart API (personal use): DXY history at start-up (and
                                   # TLT/HYG/IEF history when there is no Alpaca key),
enabled = true                     # and a second 15-min-delayed VIX quote that follows Cboe's overnight
vix_quote = true                   # session (Cboe's own delayed JSON shows the prior close until 09:30)

[connectors.rss]                   # public RSS headlines (polled with ETag / If-Modified-Since)
enabled = true
interval_s = 180
feeds = [
  { name = "FinancialJuice", url = "https://www.financialjuice.com/feed.ashx?xy=rss" },
  { name = "FT Markets", url = "https://www.ft.com/markets?format=rss" },
  { name = "Bloomberg Markets", url = "https://feeds.bloomberg.com/markets/news.rss" },
  { name = "CNBC", url = "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114" },
  { name = "FXStreet", url = "https://www.fxstreet.com/rss/news" },
  { name = "CoinDesk", url = "https://www.coindesk.com/arc/outboundfeeds/rss/" },
  { name = "Cointelegraph", url = "https://cointelegraph.com/rss" },
  { name = "The Block", url = "https://www.theblock.co/rss.xml" },
  { name = "Federal Reserve", url = "https://www.federalreserve.gov/feeds/press_all.xml" },
]

# ── series: the nodes on the map (node = true) and auxiliary inputs (node = false) ──────────
# kind:  price     one instrument             (source, symbol, field)
#        stitched  real instrument while its market is open, a 24/7 proxy otherwise
#        dxy       ICE formula on six FX pairs
#        stable_share  stablecoins' share of total crypto market cap
# field (Binance futures): "index" = Binance's index of the underlying (1 s), "last" = last trade
# reference: other quotes of the same thing, shown with their basis (not used in the maths)
# x, y: position on the map (0..1)

[[series]]
id = "bonds"
label = "US Bonds (TLT)"
short = "BONDS"
group = "safety"
kind = "stitched"
primary = { source = "alpaca", symbol = "TLT", hours = "us_regular" }
proxy = { source = "binance_fut", symbol = "TMFUSDT", field = "index", beta = 3.0 }
note = "TLT on IEX during US hours; outside them the TMF (3x TLT) perpetual's index / 3 (thin, proxy)."
x = 0.27
y = 0.04

[[series]]
id = "usd"
label = "US Dollar (DXY)"
short = "USD"
group = "safety"
kind = "dxy"
source = "finnhub"
pairs = { EURUSD = "OANDA:EUR_USD", USDJPY = "OANDA:USD_JPY", GBPUSD = "OANDA:GBP_USD", USDCAD = "OANDA:USD_CAD", USDSEK = "OANDA:USD_SEK", USDCHF = "OANDA:USD_CHF" }
history = { source = "yahoo", symbol = "DX-Y.NYB" }
reference = [{ source = "alpaca", symbol = "UUP", hours = "us_regular" }]
note = "Computed in real time from OANDA FX (Finnhub) with ICE's DXY formula; history from ICE's DXY."
x = 0.5
y = 0.0

